name: Keepalive

on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive marker
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          d="$(date '+%Y-%m-%d %H:%M:%S')"
          echo "$d" > .keepalive
          git add .keepalive
          git commit -m "chore(keepalive): ping at $d" || echo "nothing to commit"
          git push || echo "push skipped"
